[project]
name = "narravid"
version = "1.10.4"
description = "Image/video scenes + JSON narration → spoken explainer video"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]
extend-exclude = [
  ".git",
  "rendered",
  "test_output",
  "dist",
  "build",
  "__pycache__",
  # Local / ignored scratch (if present)
  "_test_*.py",
  "_ux_*.py",
]

[tool.ruff.lint]
# Practical CI baseline. pep8-naming (N) is not a hard gate yet because
# webui JS/Python still has substantial legacy short-id debt.
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line length — large single-file modules + long strings
  "E701",  # multiple statements on one line (colon) — compact handlers
  "E702",  # multiple statements on one line (semicolon) — legacy compact style
  "E401",  # multiple imports on one line — webui header style
  "B904",  # raise from within except — gradual
]

[tool.ruff.lint.per-file-ignores]
# Triple-quoted UI template; avoid fighting the HTML/JS blob.
"webui.py" = [
  "E501",
  "F401",  # imports used only from string-adjacent runtime paths still matter; keep F841 etc.
]
"_smoke_test.py" = ["ALL"]
"_*.py" = ["ALL"]
"test_e2e.py" = ["E501"]
"test_regressions.py" = ["E501", "F401", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["video_auto", "webui", "_bundled_ffmpeg"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["."]
relative_files = true
omit = [
  "tests/*",
  "run_tests.py",
  "test_e2e.py",
  "test_regressions.py",
  "_smoke_test.py",
  "_test_*.py",
  "_check_*.py",
  "_debug_*.py",
  "_ux_*.py",
  "_verify_fix.py",
  # HTML/JS lives in one Python string, so Python execution coverage is meaningless.
  "webui_ui.py",
]

[tool.coverage.report]
fail_under = 75
precision = 1
show_missing = true
skip_empty = true
