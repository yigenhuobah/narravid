name: Build & Release EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller edge-tts matplotlib

      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Build CLI exe
        run: |
          pyinstaller --onefile --name narravid --console --add-binary "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin\ffmpeg.exe;ffmpeg" --add-binary "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin\ffprobe.exe;ffmpeg" video_auto.py

      - name: Build WebUI exe
        run: |
          pyinstaller --onefile --name narravid-webui --console --add-binary "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin\ffmpeg.exe;ffmpeg" --add-binary "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin\ffprobe.exe;ffmpeg" webui.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/narravid.exe
            dist/narravid-webui.exe
          body: |
            ## narravid ${{ github.ref_name }}

            ### 无需安装 ffmpeg，exe 已自带！

            - **narravid-webui.exe** — 双击打开浏览器使用（推荐）
            - **narravid.exe** — 命令行版本

            ### 快速开始
            双击 `narravid-webui.exe`，浏览器会自动打开。
