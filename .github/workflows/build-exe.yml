name: Build & Release EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller edge-tts matplotlib aiohttp

      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Build CLI exe
        run: >
          pyinstaller --onefile --name narravid --console
          --add-binary "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin\ffmpeg.exe;ffmpeg"
          --add-binary "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin\ffprobe.exe;ffmpeg"
          --hidden-import edge_tts
          --hidden-import _bundled_ffmpeg
          --collect-all edge_tts
          video_auto.py

      - name: Build WebUI exe
        run: >
          pyinstaller --onefile --name narravid-webui --console
          --add-binary "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin\ffmpeg.exe;ffmpeg"
          --add-binary "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin\ffprobe.exe;ffmpeg"
          --hidden-import edge_tts
          --hidden-import _bundled_ffmpeg
          --hidden-import video_auto
          --hidden-import webui_jobs
          --hidden-import webui_ui
          --collect-all edge_tts
          --collect-all matplotlib
          webui.py

      - name: Extract changelog for this version
        id: changelog
        shell: python
        run: |
          import os, re
          tag = "${{ github.ref_name }}"
          with open("CHANGELOG.md", encoding="utf-8") as f:
              content = f.read()
          # Match ## [vX.Y.Z] section
          pattern = rf'## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|$)'
          m = re.search(pattern, content, re.DOTALL)
          body = m.group(1).strip() if m else "（CHANGELOG 中未找到此版本记录）"
          # Must use os.environ['GITHUB_ENV'] — a literal "$GITHUB_ENV" path does not work in Python
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"RELEASE_BODY<<EOF\n{body}\nEOF\n")

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/narravid.exe
            dist/narravid-webui.exe
          body: |
            ## narravid ${{ github.ref_name }}

            - **narravid-webui.exe** — 双击打开浏览器使用（推荐）
            - **narravid.exe** — 命令行版本

            ### 更新内容

            ${{ env.RELEASE_BODY }}
